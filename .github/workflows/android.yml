name: Build Android APK

# android/ 폴더가 바뀌면 자동 빌드. Actions 탭에서 수동 실행도 가능.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 러너에 이미 깔려 있는 Android SDK를 그대로 쓴다.
      # (서드파티 setup-android 액션은 실패해서 제거함)
      - name: Install Android SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 실패해도 일단 통과시키고, 다음 단계에서 에러를 밖으로 드러낸다.
      # (Actions 로그는 로그인해야 볼 수 있어서 어노테이션/요약으로 남긴다)
      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Surface build errors
        if: steps.build.outcome != 'success'
        run: |
          {
            echo "### 빌드 실패 — 로그 마지막 150줄"
            echo '```'
            tail -n 150 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 핵심 줄만 어노테이션으로 (로그인 없이 읽을 수 있음)
          grep -E "^(e: |w: |FAILURE:|\* What went wrong:|Caused by:|> )" /tmp/build.log \
            | head -n 40 \
            | while IFS= read -r line; do echo "::error::$line"; done

          echo "::error::빌드 실패 - 위 어노테이션과 Summary 참고"
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: fitlog-step-sync-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
